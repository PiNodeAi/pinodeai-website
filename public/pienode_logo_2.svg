<svg width="400" height="120" viewBox="0 0 400 120" xmlns="http://www.w3.org/2000/svg">
  <!-- Modern Minimalist Style -->
  <defs>
    <linearGradient id="modernGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6C5CE7;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#A29BFE;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Geometric Pie Icon -->
  <g transform="translate(30, 30)">
    <circle
      cx="30"
      cy="30"
      r="28"
      fill="none"
      stroke="url(#modernGradient)"
      stroke-width="4"
    />
    <path
      d="M 30 30 L 30 2 A 28 28 0 0 1 53 17 Z"
      fill="#6C5CE7"
      opacity="0.7"
    />
    <path
      d="M 30 30 L 53 17 A 28 28 0 0 1 53 43 Z"
      fill="#A29BFE"
      opacity="0.7"
    />
    <path
      d="M 30 30 L 53 43 A 28 28 0 0 1 30 58 Z"
      fill="#DFE6E9"
      opacity="0.5"
    />
    <circle cx="30" cy="30" r="8" fill="#6C5CE7" />
  </g>

  <!-- Text -->
  <text
    x="95"
    y="55"
    font-family="'Helvetica Neue', Arial, sans-serif"
    font-size="36"
    font-weight="300"
    fill="#2D3436"
  >
    Pie<tspan font-weight="600">Node</tspan
    ><tspan fill="#6C5CE7" font-weight="600">AI</tspan>
  </text>
</svg>

